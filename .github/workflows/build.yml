name: Build and checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Windows Forms application
        run: msbuild Hastane_Proje.sln /t:Rebuild /p:Configuration=Release /nologo /verbosity:minimal
      - name: Build checks
        run: msbuild tests/HastaneChecks.csproj /p:Configuration=Release /nologo /verbosity:minimal
      - name: Run checks without database
        run: |
          & ./tests/bin/Release/HastaneChecks.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
